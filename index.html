<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hyper Duper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout : un écran de jeu 16:9 centré, manette tactile en dessous sur mobile */
:root{
  --night:#0b1030;
  --ink:#e8ecff;
  --pink:#ff4fa3;
  --teal:#3fd9c8;
  --pad:#16205a;
  --reserve:24px;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);
  font-family:"Press Start 2P",ui-monospace,monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;box-sizing:border-box;
}
body.touch{--reserve:170px}
#wrap{width:min(100%,calc((100dvh - var(--reserve)) * 16 / 9));max-width:100%}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#000;border-radius:4px;box-shadow:0 0 0 2px #1d2a70,0 10px 40px rgba(0,0,0,.5);touch-action:none}
canvas:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
#pad{width:min(100%,560px);display:flex;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#pad .g{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
#pad button{font:inherit;font-size:9px;color:var(--ink);background:var(--pad);border:2px solid #2d3d9a;border-radius:8px;
  min-width:52px;height:52px;padding:0 8px;touch-action:none}
#pad button.big{background:var(--pink);border-color:#ff8cc4;color:#1a0718;min-width:72px;height:64px}
#pad button.dir{min-width:64px;height:64px;font-size:16px}
#pad button:active,#pad button.on{filter:brightness(1.5)}
</style>

<div id="wrap"><canvas id="c" width="384" height="216" tabindex="0" aria-label="Jeu Hyper Duper"></canvas></div>
<div id="pad" hidden>
  <div class="g"><button class="dir" data-a="left" aria-label="Gauche">&lt;</button><button class="dir" data-a="right" aria-label="Droite">&gt;</button></div>
  <div class="g"><button data-a="lights">PHARES</button><button data-a="horn">TUUT</button><button data-a="talk">PARLER</button><button data-a="boost">TURBO</button><button class="big" data-a="jump">SAUT</button></div>
</div>

/* ================= utilitaires ================= */
function hash(n){n=(n|0)^0x9e3779b9;n=Math.imul(n^(n>>>16),0x85ebca6b);n=Math.imul(n^(n>>>13),0xc2b2ae35);n^=n>>>16;return(n>>>0)/4294967296;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function noise1(x,seed){const i=Math.floor(x),f=x-i,a=hash(i+seed*7919),b=hash(i+1+seed*7919),u=f*f*(3-2*f);return a+(b-a)*u;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rgbC={};
function rgb(h){let c=rgbC[h];if(!c){c=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];rgbC[h]=c;}return c;}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return`rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function sstep(e0,e1,x){const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);}

let AC=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function tone(f1,f2,d,wave,v,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=wave||'square';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||0.06,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}

const chunks=new Map();
function gLevel(i){if(i<3)return 176;const j=Math.floor(((i*CH)%BL)/CH);if(j===0)return 176;return 152+Math.floor(hash(i*7+3)*4)*8;}
function getChunk(i){if(i<0)return null;let c=chunks.get(i);if(!c){c=genChunk(i);chunks.set(i,c);}return c;}
function genChunk(i){
  const R=mulberry32(i*7919+13),x0=i*CH,gy=gLevel(i),bi=biomeIdx(x0),B=BIOMES[bi];
  const j=Math.floor((x0%BL)/CH),d=Math.min(1,i/90);
  const c={i,x0,gy,bi,solids:[],spikes:[],cans:[],npcs:[],decor:[],posts:[],sign:null};
  const ground=(a,b)=>c.solids.push({x:x0+a,y:gy,w:b-a,h:H+40-gy,t:'g'});
  const block=(x,w,h)=>c.solids.push({x:x0+x,y:gy-h,w,h,t:'g'});
  const plat=(x,y,w)=>c.solids.push({x:x0+x,y,w,h:8,t:'p'});
  const spikes=(x,n,y)=>c.spikes.push({x:x0+x,y:(y||gy)-8,w:n*8});
  const can=(x,y,p)=>{if(R()<(p||0.6))c.cans.push({x:x0+x,y,taken:false,ph:R()*6});};
  const npc=k=>{c.npcs.push({k,x:x0+120,y:gy,state:'idle',t:0,flip:false,oy:0,alpha:1,vx:0,life:0,hop:0,lightCd:0,squint:0,frozen:0,talked:false});};
  let pat;
  if(i<2)pat='flat';
  else if(j===0)pat='biome';
  else if(j===2||j===7||j===11)pat='npc';
  else if(j===5||j===10)pat='post';
  else{const r=R();pat=r<0.26?'gap':r<0.44?'plats':r<0.62?'step':r<0.84?'spikes':'float';}
  switch(pat){
    case'flat':ground(0,CH);if(i===1)can(120,gy-30,1);break;
    case'biome':ground(0,CH);c.posts.push({x:x0+40,y:gy,lit:false});c.sign={x:x0+92,y:gy};break;
    case'post':ground(0,CH);c.posts.push({x:x0+96,y:gy,lit:false});can(150,gy-34,0.5);break;
    case'npc':{ground(0,CH);const L=B.npcs;npc(L[(j===2?0:j===7?1:2)%L.length]);can(40,gy-30,0.4);break;}
    case'gap':{const a=56+Math.floor(R()*5)*8,g=40+Math.floor(d*2.5+R()*2)*8;ground(0,a);ground(a+g,CH);can(a+g/2-3,gy-58,0.7);if(R()<0.35+d*0.3)spikes(Math.min(CH-16,a+g+24),1+Math.floor(R()*(1+d)));break;}
    case'plats':{ground(0,40);ground(CH-40,CH);const hy=d>0.5&&R()<0.5?36:24;plat(64,gy-hy,40);can(80,gy-hy-16,0.8);break;}
    case'step':{ground(0,CH);const h=R()<0.5?16:24;block(72,40,h);can(88,gy-h-28,0.5);if(R()<0.4+d*0.4)spikes(136,1+Math.floor(R()*2));break;}
    case'spikes':{ground(0,CH);const n=1+Math.floor(R()*(1.5+d*2.5));spikes(72,n);can(72+n*4-3,gy-50,0.6);if(d>0.4&&R()<0.5)spikes(160,1);break;}
    case'float':{ground(0,CH);plat(40,gy-32,32);plat(100,gy-58,36);can(114,gy-74,0.9);if(R()<0.6)spikes(56,2);break;}
  }
  // décor posé sur le sol
  for(let k=0;k<7;k++){
    const x=x0+Math.floor(R()*CH);let top=null;
    for(const s of c.solids)if(s.t==='g'&&x>=s.x+2&&x<s.x+s.w-2&&(top===null||s.y<top))top=s.y;
    if(top===null)continue;
    if(c.spikes.some(s=>x>s.x-6&&x<s.x+s.w+6))continue;
    if(c.npcs.some(n=>Math.abs(n.x-x)<14))continue;
    c.decor.push({x,y:top,type:B.decor[Math.floor(R()*B.decor.length)],col:R(),bend:0,cd:0});
  }
  return c;
}
function chunksAround(x,l,r){const out=[];const a=Math.floor(x/CH)-l,b=Math.floor(x/CH)+r;for(let i=Math.max(0,a);i<=b;i++)out.push(getChunk(i));return out;}
function groundTopAt(x){const c=getChunk(Math.floor(x/CH));let top=H;if(!c)return 176;for(const s of c.solids)if(x>=s.x&&x<s.x+s.w&&s.y<top)top=s.y;return top;}

function burst(x,y,n,cols,sp,grav){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=(0.5+Math.random())*(sp||1.5);puff(x,y,Math.cos(a)*v,Math.sin(a)*v-1,1+(Math.random()*2|0),0,30+Math.random()*20|0,cols[k%cols.length],grav===undefined?0.08:grav);}}

function respawn(stalled){

function solidsNear(){const out=[];for(const c of chunksAround(P.x,1,1))for(const s of c.solids)out.push(s);return out;}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

function updatePlayer(){
  const B=BIOMES[curBiome];
  let dir=(held.right?1:0)-(held.left?1:0);
  if(dialog||P.stall||P.dead)dir=0;
  P.idle=(dir||held.jump||held.boost||held.horn)?0:P.idle+1;
  P.boost=!!held.boost&&dir!==0&&P.fuel>0;
  const max=P.boost?3.6:2.3;
  if(dir){
    const rev=Math.sign(P.vx)===-dir;
    P.vx+=dir*(rev?0.24:0.1)*(P.boost?1.5:1);P.face=dir;
    if(rev&&P.ground&&Math.abs(P.vx)>0.8&&T%3===0){const e=exhaust();puff(P.x+P.w/2,P.y+P.h-1,-dir*0.5,-0.4,2,0.05,20,B.top,0);}
    if(!rev&&Math.abs(P.vx)<1&&P.ground&&T%6===0){const e=exhaust();puff(e.x,e.y,-P.face*0.6,-0.3,2,0.12,30,'#8a90a6');}
  }else{const f=P.ground?0.07:0.02;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f;}
  if(Math.abs(P.vx)>max)P.vx=Math.sign(P.vx)*Math.max(max,Math.abs(P.vx)-0.05);

  if(pressed.jump&&!dialog)P.jb=7;else if(P.jb>0)P.jb--;
  if(P.ground)P.coy=6;else if(P.coy>0)P.coy--;
  if(P.jb>0&&P.coy>0&&!P.stall&&!P.dead){P.vy=-6.2;P.jb=0;P.coy=0;P.ground=false;P.squash=-0.22;sfx('jump');
    for(let k=0;k<5;k++)puff(P.x+6+Math.random()*(P.w-12),P.y+P.h,(Math.random()-0.5),-0.3,1,0,20,B.top,0.02);}
  if(!held.jump&&P.vy<-2)P.vy+=0.38;
  P.vy=Math.min(P.vy+0.32,7.5);

  const sol=solidsNear();
  // axe X
  P.x+=P.vx;if(P.x<0){P.x=0;P.vx=0;}
  for(const s of sol){if(s.t!=='g')continue;if(!overlap(P.x,P.y,P.w,P.h,s.x,s.y,s.w,s.h))continue;
    const feet=P.y+P.h;
    if(feet-s.y<=5&&P.ground){P.y=s.y-P.h;continue;}
    if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;P.vx=0;}
  // axe Y
  const prevBottom=P.y+P.h,wasAir=!P.ground,fallV=P.vy;
  P.y+=P.vy;P.ground=false;
  for(const s of sol){if(!overlap(P.x,P.y,P.w,P.h,s.x,s.y,s.w,s.h))continue;
    if(s.t==='p'){if(P.vy>=0&&prevBottom<=s.y+0.5){P.y=s.y-P.h;P.vy=0;P.ground=true;}continue;}
    if(P.vy>0){P.y=s.y-P.h;P.vy=0;P.ground=true;}else if(P.vy<0){P.y=s.y+s.h;P.vy=0;}}
  if(P.ground&&wasAir&&fallV>3){P.squash=clamp(fallV*0.045,0.1,0.3);sfx('land');
    for(let k=0;k<8;k++)puff(P.x+P.w/2+(Math.random()-0.5)*P.w,P.y+P.h-1,(Math.random()-0.5)*2,-Math.random()*0.8,1+(Math.random()*2|0),0,24,k%2?B.top:B.dirt,0.05);}
  P.air=P.ground?0:P.air+1;
  P.squash*=0.82;

  // carburant
  if(!P.dead&&!P.stall){let drain=0.004;if(Math.abs(P.vx)>0.3)drain=0.04;if(P.boost)drain=0.11;P.fuel=Math.max(0,P.fuel-drain);
    if(P.fuel<=0){P.stall=1;feel('deprime',240);say(P.x+P.w/2,P.y-14,'PANNE SÈCHE...','#9fc0ff',150);}}
  if(P.stall){P.stall++;if(P.stall%25===0){const e=exhaust();puff(e.x,e.y,-P.face*0.3,-0.4,2,0.1,40,'#555b70');}if(P.stall>200)respawn(true);}
  if(P.fuel<25&&P.fuel>0)showHint('fuel','RAMASSE DES BIDONS D\'ESSENCE !',220);

  // turbo = fumée
  if(P.boost){const e=exhaust();for(let k=0;k<2;k++)puff(e.x,e.y+(Math.random()*3|0),-P.face*(0.6+Math.random()*0.8)+P.vx*0.25,-0.15-Math.random()*0.4,2,0.14,34+Math.random()*16|0,Math.random()<0.5?'#b9bfd4':'#8a90a6');
    if(T%3===0)puff(e.x,e.y+1,-P.face*1.4,0,1,0,8,Math.random()<0.5?'#ffcf3f':'#ff6a2a');}

  // pics
  if(P.inv>0)P.inv--;
  else if(!P.dead){for(const c of chunksAround(P.x,1,1))for(const s of c.spikes){
    if(overlap(P.x+4,P.y,P.w-8,P.h,s.x+2,s.y+3,s.w-4,5)){hurt();break;}}}
  // chute
  if(P.y>H+24&&!P.dead){P.dead=1;sfx('fall');feel('deprime',120);P.fuel=Math.max(0,P.fuel-10);}
  if(P.dead){P.dead++;if(P.dead>70)respawn(false);}

  // bidons, bornes, décor
  const cx=P.x+P.w/2;
  for(const c of chunksAround(P.x,1,1)){
    for(const k of c.cans){if(k.taken)continue;const by=k.y+Math.sin(T*0.08+k.ph)*2;

        for(let k=0;k<4;k++)puff(P.x+P.w/2+(Math.random()-0.5)*20,P.y-4,(Math.random()-0.5)*0.4,-0.5,1,0,60,'#ff4fa3',0,'heart');}}}}

function spikeAhead(){if(!P.ground)return false;for(const c of chunksAround(P.x,1,1))for(const s of c.spikes){

function baseEmotion(){const B=BIOMES[curBiome],night=nightAt(P.x+P.w/2);let e='serein';
  if(night>0.5&&P.lights)e='rassure';

}
function updateParticles(){

let wType='',wp=[];
function setWeather(t){wType=t;wp=[];const n={fireflies:22,butterflies:7,snow:90,rain:80,dust:34,starrain:22}[t]||0;for(let k=0;k<n;k++)wp.push(newW(t,true,k));}
function newW(t,init,k){const p={x:Math.random()*W,y:init?Math.random()*H:-12,ph:Math.random()*6.28};
  switch(t){case'snow':p.vy=0.35+Math.random()*0.7;p.vx=-0.25-Math.random()*0.4;p.s=Math.random()<0.2?2:1;break;
    case'rain':p.vy=5+Math.random()*2;p.vx=-1.1;p.l=4+(Math.random()*5|0);break;
    case'starrain':p.vy=2.2+Math.random()*2;p.vx=0;p.l=14+(Math.random()*40|0);break;
    case'dust':p.vx=-1.4-Math.random()*1.6;p.vy=(Math.random()-0.5)*0.3;p.y=60+Math.random()*150;if(!init)p.x=W+4;break;
    case'fireflies':p.y=50+Math.random()*130;p.vx=0;p.vy=0;break;
    case'butterflies':p.y=60+Math.random()*90;p.c=['#ffd23f','#ff7ac8','#ffffff','#8fd0ff'][(k||0)%4];break;}
  return p;}
function updateWeather(){const bl=blendAt(camX+W/2);const want=(bl.t<0.5?bl.a:bl.b).weather;if(want!==wType)setWeather(want);moveWeather(camX-lastCamX);}
function moveWeather(dc){
  for(const p of wp){
    const par=wType==='fireflies'?1:wType==='butterflies'?0.9:0.6;p.x-=dc*par;
    if(wType==='fireflies'){p.ph+=0.03;p.x+=Math.cos(p.ph)*0.3;p.y+=Math.sin(p.ph*1.3)*0.25;}
    else if(wType==='butterflies'){p.ph+=0.15;p.x+=Math.cos(p.ph*0.2)*0.6;p.y+=Math.sin(p.ph*0.3)*0.5;}
    else{p.x+=p.vx;p.y+=p.vy;if(wType==='snow')p.x+=Math.sin(T*0.02+p.ph)*0.2;}
    if(p.x<-12)p.x+=W+24;if(p.x>W+12)p.x-=W+24;
    if(p.y>H+4){Object.assign(p,newW(wType,false));p.x=Math.random()*W;}}

function txt(s,x,y,col,align,size,shadow){ctx.font=(size||8)+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';
  if(shadow!==false){ctx.fillStyle=shadow||'#0a0d24';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}ctx.fillStyle=col||'#fff';ctx.fillText(s,Math.round(x),Math.round(y));}
function circ(cx,cy,r,step){cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);step=step||2;for(let dy=-r;dy<=r;dy+=step){const half=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));ctx.fillRect(cx-half,cy+dy,half*2+1,step);}}

function drawBG(B,cx){
  const steps=12;for(let k=0;k<steps;k++){ctx.fillStyle=mix(B.sky[0],B.sky[1],k/(steps-1));const y0=Math.floor(H*0.75*k/steps);ctx.fillRect(0,y0,W,Math.ceil(H*0.75/steps)+1);}
  ctx.fillStyle=B.sky[1];ctx.fillRect(0,Math.floor(H*0.75),W,H);
  if(B.stars)drawStars(B,cx);
  if(B.aurora)drawAurora();
  if(B.cel)drawCel(B);
  if(B.clouds)drawClouds(B,cx);
  drawRidge(B,cx);
  drawTrees(B,cx,0.3,26,B.treesMid,B.densMid,B.mid,138,20,40,1);

}
function drawStars(B,cx){for(let k=0;k<70;k++){const sx=(((hash(k*3+1)*W*2-cx*0.03)%W)+W)%W,sy=hash(k*7+5)*118|0;const tw=Math.sin(T*0.05+k)*0.5+0.5;ctx.fillStyle=tw>0.75?'#ffffff':'#9fb4ff';ctx.fillRect(sx|0,sy,1,1);}
  if(B.sparkles)for(let k=0;k<7;k++){const sx=((((hash(k*11+3)*W*2-cx*0.03)%W)+W)%W)|0,sy=10+(hash(k*17+2)*110|0);const s=Math.sin(T*0.04+k*2)>0?2:1;ctx.fillStyle='#ff6fd0';ctx.fillRect(sx-s-1,sy,s*2+3,1);ctx.fillRect(sx,sy-s-1,1,s*2+3);ctx.fillStyle='#ffffff';ctx.fillRect(sx,sy,1,1);}}
function drawAurora(){const ga=ctx.globalAlpha;for(let ri=0;ri<3;ri++){ctx.fillStyle=ri===1?'#ff6fd0':'#4dffb0';ctx.globalAlpha=ga*(ri===1?0.12:0.17);
  for(let x=0;x<W;x+=3){const y=22+ri*15+Math.sin(x*0.018+T*0.012+ri*2)*12,h=14+Math.sin(x*0.05+T*0.02+ri)*8;ctx.fillRect(x,Math.round(y),3,Math.round(h));}}ctx.globalAlpha=ga;}
function drawCel(B){
  if(B.cel==='moon'){ctx.fillStyle='#f4f0d8';circ(64,34,9,1);ctx.fillStyle=mix(B.sky[0],B.sky[1],0.12);circ(69,31,8,1);}
  else if(B.cel==='sun'){ctx.fillStyle='#fff3a0';circ(312,38,13,1);ctx.fillStyle='#ffffff';circ(308,34,5,1);}
  else if(B.cel==='bigsun'){ctx.fillStyle='#fff0a8';circ(250,100,40,1);ctx.fillStyle='#ffb070';for(let k=0;k<6;k++)ctx.fillRect(208,104+k*6,84,1+(k>>1));}}
function drawClouds(B,cx){const off=cx*0.06+T*0.05,sp=140,i0=Math.floor((off-90)/sp),i1=Math.floor((off+W)/sp);
  for(let i=i0;i<=i1;i++){if(hash(i*5+9)<0.35)continue;const x=Math.round(i*sp+hash(i*3)*60-off),y=18+(hash(i*7)*64|0),s=0.7+hash(i*11)*0.6,w=Math.round(46*s);
    ctx.fillStyle=mix(B.cloud,B.sky[0],0.4);ctx.fillRect(x+3,y+8,w-6,4);ctx.fillStyle=B.cloud;ctx.fillRect(x,y+2,w,7);ctx.fillRect(x+6,y-3,Math.round(w*0.4),6);ctx.fillRect(x+Math.round(w*0.45),y-6,Math.round(w*0.35),9);}}
function drawRidge(B,cx){const off=cx*0.12,base=124,amp=B.ridge==='peaks'?64:B.ridge==='mesa'?48:34,st=4,start=-(Math.floor(off)%st);
  for(let sx=start;sx<W;sx+=st){const wx=Math.floor((sx+off)/st);let h;
    if(B.ridge==='peaks'){const n=noise1(wx/12,1);h=(1-Math.abs(n*2-1))*0.8+noise1(wx/3,2)*0.2;}
    else if(B.ridge==='mesa'){const n=noise1(wx/16,3);h=n>0.55?0.95:n>0.4?0.6:0.25;}
    else h=noise1(wx/22,4)*0.8+noise1(wx/6,5)*0.2;
    const y=Math.round(base-h*amp);ctx.fillStyle=B.far;ctx.fillRect(sx,y,st,H-y);

function drawTrees(B,cx,par,sp,styles,dens,col,base,hmin,hmax,seed){
  if(styles.length){const off=cx*par,i0=Math.floor((off-70)/sp),i1=Math.floor((off+W+70)/sp);
    for(let i=i0;i<=i1;i++){if(hash(i*13+seed*1000)>dens)continue;const x=i*sp+hash(i*29+seed*77)*sp*0.8-off,h=hmin+(hash(i*41+seed)*(hmax-hmin)|0),st=styles[(hash(i*53+seed*3)*styles.length)|0];tree(st,x,base,h,col,B);}}
  ctx.fillStyle=col;ctx.fillRect(0,base,W,H-base);}
function tree(st,x,base,h,col,B){x=Math.round(x);ctx.fillStyle=col;
  if(st==='pine'||st==='snowpine'){const w=Math.max(6,(h*0.5)|0),hh=Math.floor(h*0.85),tier=Math.max(6,(hh/3)|0);
    ctx.fillRect(x-1,base-h+hh-2,3,h-hh+2);
    for(let r=0;r<hh;r+=2){const tp=(r%tier)/tier,half=Math.max(1,Math.floor((0.35+0.65*tp)*(0.3+0.7*r/hh)*w/2));ctx.fillStyle=(st==='snowpine'&&(r%tier)<3)?'#e3eeff':col;ctx.fillRect(x-half,base-h+r,half*2+1,2);}}
  else if(st==='round'){const r=Math.max(5,(h*0.3)|0);ctx.fillRect(x-1,Math.round(base-h*0.5),3,Math.round(h*0.5));circ(x,base-h+r,r);circ(x-r*0.6,base-h+r*1.5,r*0.8);circ(x+r*0.6,base-h+r*1.5,r*0.8);}
  else if(st==='palm'){let tx=x;for(let k=0;k<h;k+=2){tx=x+Math.round(Math.sin(k/h*1.6)*h*0.18);ctx.fillRect(tx-1,base-k-2,3,2);}const ty=base-h;
    for(const a of[-2.8,-2.2,-1.5,-0.9,-0.3]){for(let s=0;s<h*0.45;s+=2){const fx=Math.cos(a)*s,fy=Math.sin(a)*s*0.6+s*s/(h*0.9);ctx.fillRect(Math.round(tx+fx)-1,Math.round(ty+fy),3,2);}}}
  else if(st==='cactus'){ctx.fillRect(x-2,base-h,5,h);ctx.fillRect(x-1,base-h-1,3,1);const a1=(h*0.45)|0;ctx.fillRect(x-7,base-a1,5,3);ctx.fillRect(x-7,base-a1-8,3,8);const a2=(h*0.6)|0;ctx.fillRect(x+3,base-a2,5,3);ctx.fillRect(x+6,base-a2-7,3,7);}}
function drawVines(B,cx){const off=cx*0.8,sp=46,i0=Math.floor(off/sp)-1,i1=Math.floor((off+W)/sp)+1;ctx.fillStyle='#0a2a18';
  for(let i=i0;i<=i1;i++){if(hash(i*19)<0.4)continue;const x=Math.round(i*sp+hash(i*23)*20-off),len=18+(hash(i*31)*60|0);const sw=Math.round(Math.sin(T*0.02+i)*2);
    for(let y=0;y<len;y+=2){const xx=x+Math.round(sw*y/len);ctx.fillRect(xx,y,2,2);if(y%8===4){ctx.fillRect(xx-3,y,3,2);ctx.fillRect(xx+2,y+2,3,2);}}}}

function drawSolid(s,B,cx){const x0=Math.max(s.x,cx-2),x1=Math.min(s.x+s.w,cx+W+2);if(x1<=x0)return;
  const y=s.y,bottom=s.t==='p'?s.y+s.h:Math.min(s.y+s.h,H);

  ctx.fillStyle=B.dirt2;
  for(let wx=Math.floor(x0/4)*4;wx<x1;wx+=4)for(let wy=y+6;wy<bottom;wy+=4)if(hash(wx*7+wy*131)<0.16)ctx.fillRect(wx-cx,wy,2,2);
  if(s.t==='p')for(let wx=Math.floor(x0/2)*2;wx<x1;wx+=2){const dd=(hash(wx*9+3)*4)|0;ctx.fillRect(wx-cx,bottom,2,dd);}
  if(s.x>=x0){ctx.fillRect(s.x-cx,y+3,1,bottom-y-3);}if(s.x+s.w<=x1){ctx.fillRect(s.x+s.w-cx-1,y+3,1,bottom-y-3);}
  for(let wx=Math.floor(x0/2)*2;wx<x1;wx+=2){const hh=3+((hash(wx*3+11)*3)|0);ctx.fillStyle=B.top;ctx.fillRect(wx-cx,y,2,hh);if(hash(wx*5+7)<0.35){ctx.fillStyle=B.top2;ctx.fillRect(wx-cx,y,2,1);}}}
function drawSpikes(s,B,cx){for(let k=0;k<s.w;k+=8){const x=Math.round(s.x+k-cx);for(let r=0;r<8;r++){const half=r>>1;ctx.fillStyle=B.spike;ctx.fillRect(x+3-half,s.y+r,2+half*2,1);ctx.fillStyle=B.spike2;ctx.fillRect(x+4,s.y+r,1+half,1);}ctx.fillStyle='#ffffff';ctx.fillRect(x+3,s.y,1,1);}}
function drawPost(p,cx){const x=Math.round(p.x-cx),y=p.y;ctx.fillStyle='#2b3050';ctx.fillRect(x,y-30,2,30);ctx.fillRect(x-1,y-2,4,2);ctx.fillRect(x-3,y-33,8,3);
  ctx.fillStyle=p.lit?'#ffe27a':'#6a6f85';ctx.fillRect(x-2,y-30,6,3);if(p.lit&&T%40<20){ctx.fillStyle='#ffffff';ctx.fillRect(x,y-30,1,1);}}
function drawSign(sg,B,cx){const x=Math.round(sg.x-cx),y=sg.y;ctx.fillStyle='#5a3a22';ctx.fillRect(x+10,y-14,2,14);ctx.fillStyle='#8a5a32';ctx.fillRect(x,y-24,24,11);ctx.fillStyle='#3e2716';ctx.fillRect(x,y-14,24,1);
  ctx.fillStyle='#f6e6c0';ctx.fillRect(x+5,y-19,12,1);ctx.fillRect(x+14,y-21,1,5);ctx.fillRect(x+15,y-20,1,3);ctx.fillRect(x+16,y-19,1,1);}
function flowerCol(d){return['#ff6fb5','#ffd23f','#ffffff','#7fc8ff','#ff8a3d'][(d.col*5)|0];}
function drawDecor(d,cx){const x=Math.round(d.x-cx),y=d.y,b=Math.round(d.bend);
  const blades=(c1,c2,h)=>{for(const k of[-2,0,2])for(let r=0;r<h;r++){ctx.fillStyle=r>=h-1?c2:c1;ctx.fillRect(x+k+Math.round((k*0.4+b)*r/h),y-1-r,1,1);}};
  switch(d.type){
    case'fern':blades('#2f7f3a','#6fcf5a',5+(d.col*3|0));break;
    case'tuft':blades('#4fa83a','#a8ec6a',4);break;
    case'tuft_dry':blades('#b08a4a','#e8c87a',4);break;
    case'grass':blades('#3fae4a','#9cf07a',6+(d.col*4|0));break;
    case'flower':{ctx.fillStyle='#3f8f3a';for(let r=0;r<5;r++)ctx.fillRect(x+Math.round(b*r/5),y-1-r,1,1);const fx=x+b,fy=y-7;ctx.fillStyle=flowerCol(d);ctx.fillRect(fx-1,fy,3,1);ctx.fillRect(fx,fy-1,1,3);ctx.fillStyle='#ffe680';ctx.fillRect(fx,fy,1,1);break;}
    case'mushroom':ctx.fillStyle='#f0e6d0';ctx.fillRect(x,y-3,2,3);ctx.fillStyle='#d83a3a';ctx.fillRect(x-2+b,y-5,6,2);ctx.fillRect(x-1+b,y-6,4,1);ctx.fillStyle='#ffffff';ctx.fillRect(x+b,y-5,1,1);break;
    case'bush':ctx.fillStyle='#24602c';ctx.fillRect(x-4+b,y-4,9,4);ctx.fillRect(x-2+b,y-6,5,2);ctx.fillStyle='#4f9f3a';ctx.fillRect(x-2+b,y-6,2,1);break;
    case'bigleaf':ctx.fillStyle='#1f7a3a';ctx.fillRect(x,y-6,1,6);ctx.fillRect(x-4+b,y-7,4,2);ctx.fillRect(x+1+b,y-5,4,2);ctx.fillStyle='#5fd06a';ctx.fillRect(x-4+b,y-7,2,1);break;
    case'snowmound':ctx.fillStyle='#ffffff';ctx.fillRect(x-3,y-2,7,2);ctx.fillRect(x-2,y-3,5,1);break;
    case'ice':ctx.fillStyle='#bfe6ff';ctx.fillRect(x,y-6,1,6);ctx.fillRect(x-1,y-3,3,1);ctx.fillStyle='#ffffff';ctx.fillRect(x,y-6,1,1);break;
    case'rock':ctx.fillStyle='#8a6a5a';ctx.fillRect(x-2,y-3,6,3);ctx.fillStyle='#b8988a';ctx.fillRect(x-1,y-4,3,1);break;
    case'smallcactus':ctx.fillStyle='#4f8f3a';ctx.fillRect(x,y-7,2,7);ctx.fillRect(x-2,y-4,2,1);ctx.fillRect(x-2,y-6,1,2);ctx.fillRect(x+2,y-5,2,1);ctx.fillRect(x+3,y-6,1,1);break;
  }}
function drawNPC(n,cx){const K=NPCK[n.k];let pal=K.pal;if(n.squint&&K.spr==='owl')pal='owlsq';const c=spr(K.spr,pal);
  const x=n.x-cx,baseY=n.y-(K.perch?5:0);
  if(K.perch){ctx.fillStyle='#5a3a22';ctx.fillRect(Math.round(x-6),n.y-5,12,5);ctx.fillStyle='#7a5032';ctx.fillRect(Math.round(x-6),n.y-5,12,1);}
  ctx.globalAlpha=n.alpha;
  let bob=(n.state==='idle'||n.state==='talk')&&!n.frozen?((Math.floor(n.t/20)%2)?-1:0):0;
  let rx=n.react>0?(Math.random()-0.5)*2:0;
  if(K.spr==='bird'&&n.state==='fly')bob=(Math.floor(n.t/4)%2)?-1:0;
  blit(c,x-c.width/2+rx,baseY-c.height+n.oy+bob,n.flip);
  if(n.state==='wave'&&Math.floor(n.t/6)%2){ctx.fillStyle=PAL[K.pal].s||'#fff';ctx.fillRect(Math.round(x+(n.flip?4:-4)),Math.round(baseY-c.height+2),2,4);}
  if(K.spr==='cat'&&T%30<15){ctx.fillStyle='#ff6fd0';ctx.fillRect(Math.round(x+6),Math.round(baseY-c.height-3),1,1);ctx.fillRect(Math.round(x-5),Math.round(baseY-c.height+1),1,1);}
  ctx.globalAlpha=1;}

function drawCar(cx){
  if(P.inv>0&&Math.floor(P.inv/4)%2===0&&!P.stall)return;
  let ox=0,oy=0;const e=emo.cur;
  if((e==='froid'&&T%60<14)||e==='peur'||e==='noir')ox=(T%4<2)?1:0;
  if(e==='joie'&&emo.evT>0)oy=-Math.round(Math.abs(Math.sin(T*0.3))*2);
  if(P.ground&&Math.abs(P.vx)>0.5&&T%8<4)oy-=1;
  let tilt=P.ground?0:clamp(P.vy*0.035,-0.18,0.2);
  if(e==='ennui'||e==='deprime')tilt+=0.03+Math.sin(T*0.03)*0.01;
  const sy=1-P.squash,sx=1+P.squash*0.5;
  const px=Math.round(P.x-4-cx+CW/2+ox),py=Math.round(P.y-3+CHT+oy);
  ctx.save();ctx.translate(px,py);ctx.scale(P.face*sx,sy);ctx.rotate(tilt);
  if(carReady)ctx.drawImage(carImg,-Math.round(CW/2),-CHT,CW,CHT);
  else{ctx.fillStyle='#2fb5a5';ctx.fillRect(-CW/2,-CHT+4,CW,CHT-8);ctx.fillStyle='#111';ctx.fillRect(-CW/2+8,-5,10,5);ctx.fillRect(CW/2-18,-5,10,5);}
  if(P.lights){ctx.fillStyle='#fffbe0';ctx.fillRect(Math.round(CW*0.31),-Math.round(CHT*0.38),4,2);}
  ctx.restore();}

function drawParticles(cx){for(const p of parts){const a=p.life/p.max;const x=Math.round(p.x-cx),y=Math.round(p.y),s=Math.max(1,Math.round(p.s));
  if(p.shape==='heart'){ctx.globalAlpha=Math.min(1,a*1.5);ctx.fillStyle=p.c;ctx.fillRect(x,y,2,1);ctx.fillRect(x+3,y,2,1);ctx.fillRect(x,y+1,5,1);ctx.fillRect(x+1,y+2,3,1);ctx.fillRect(x+2,y+3,1,1);}
  else{ctx.globalAlpha=p.g>0?a*0.85:Math.min(1,a*1.6);ctx.fillStyle=p.c;ctx.fillRect(x-(s>>1),y-(s>>1),s,s);}}ctx.globalAlpha=1;}
function drawWeather(){for(const p of wp){const x=Math.round(p.x),y=Math.round(p.y);switch(wType){
  case'snow':ctx.fillStyle='#ffffff';ctx.fillRect(x,y,p.s,p.s);break;
  case'rain':ctx.fillStyle='rgba(170,220,255,0.55)';ctx.fillRect(x,y,1,p.l);break;
  case'starrain':ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillRect(x,y,1,p.l);break;
  case'dust':ctx.fillStyle='rgba(255,225,180,0.7)';ctx.fillRect(x,y,2,1);break;
  case'fireflies':{const on=Math.sin(T*0.06+p.ph*5)>-0.2;if(on){ctx.fillStyle='#eaff7a';ctx.fillRect(x,y,1,1);}break;}
  case'butterflies':{const f=Math.floor(T/5+p.ph)%2;ctx.fillStyle=p.c;if(f){ctx.fillRect(x-2,y,2,2);ctx.fillRect(x+1,y,2,2);}else{ctx.fillRect(x-1,y,1,2);ctx.fillRect(x+1,y,1,2);}ctx.fillStyle='#2a2a2a';ctx.fillRect(x,y,1,2);break;}}}}

/* lumière : un voile sombre percé par les phares, bornes, lucioles */
const LC=document.createElement('canvas');LC.width=W;LC.height=H;const lc=LC.getContext('2d');
function hole(x,y,r,a){const g=lc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');lc.fillStyle=g;lc.fillRect(x-r,y-r,r*2,r*2);}
function beamPath(g,hx,hy,dir,len){g.beginPath();g.moveTo(hx,hy-2);g.lineTo(hx+dir*len,hy-36);g.lineTo(hx+dir*len,hy+44);g.lineTo(hx,hy+3);g.closePath();}
function drawLighting(cx,vis){const night=nightAt(camX+W/2);const h=headlight(),hx=h.x-cx,hy=h.y;
  if(night>0.04){
    lc.globalCompositeOperation='source-over';lc.clearRect(0,0,W,H);
    const g=lc.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(3,5,22,${night*0.3})`);g.addColorStop(0.55,`rgba(3,5,22,${night*0.78})`);g.addColorStop(1,`rgba(3,5,22,${night*0.9})`);
    lc.fillStyle=g;lc.fillRect(0,0,W,H);
    lc.globalCompositeOperation='destination-out';
    hole(P.x-cx+P.w/2,P.y+P.h/2,38,0.5);
    if(P.lights){const len=180,lg=lc.createLinearGradient(hx,hy,hx+P.face*len,hy);lg.addColorStop(0,'rgba(0,0,0,0.97)');lg.addColorStop(1,'rgba(0,0,0,0)');lc.fillStyle=lg;beamPath(lc,hx,hy,P.face,len);lc.fill();hole(hx,hy,10,1);}
    for(const c of vis){for(const p of c.posts)if(p.lit)hole(p.x-cx+1,p.y-28,48,0.85);
      for(const k of c.cans)if(!k.taken)hole(k.x-cx+3,k.y+4,14,0.7);
      for(const n of c.npcs)if(n.state!=='gone')hole(n.x-cx,n.y-8,18,0.4);}
    if(wType==='fireflies')for(const p of wp)if(Math.sin(T*0.06+p.ph*5)>-0.2)hole(p.x,p.y,7,0.9);
    for(const f of floats)hole(f.x-cx,f.y+4,16,0.5);
    ctx.drawImage(LC,0,0);}
  if(P.lights){ctx.save();ctx.globalCompositeOperation='lighter';const len=180,lg=ctx.createLinearGradient(hx,hy,hx+P.face*len,hy);
    lg.addColorStop(0,`rgba(255,236,150,${0.14+night*0.12})`);lg.addColorStop(1,'rgba(255,236,150,0)');ctx.fillStyle=lg;beamPath(ctx,hx,hy,P.face,len);ctx.fill();
    ctx.fillStyle='rgba(255,250,210,0.9)';ctx.fillRect(Math.round(hx)-1,Math.round(hy)-1,3,3);ctx.restore();}}

function drawRings(cx){for(const r of rings){if(r.t<0)continue;const rad=6+r.t*2.4,a=1-r.t/32;ctx.strokeStyle=`rgba(255,111,208,${a})`;ctx.lineWidth=2;ctx.beginPath();
  const c=r.dir>0?0:Math.PI;ctx.arc(Math.round(r.x-cx),Math.round(r.y),rad,c-0.7,c+0.7);ctx.stroke();}}
function drawFloats(cx){for(const f of floats){ctx.globalAlpha=Math.min(1,f.t/20);txt(f.text,f.x-cx,f.y,f.color,'center');}ctx.globalAlpha=1;}
function drawBubble(cx){if(emo.bubble<=0||P.dead)return;const k=emo.bubble;const a=k<15?k/15:1;const pop=k>132?(140-k)*1.2:0;
  const x=Math.round(P.x-cx+P.w/2+P.face*12),y=Math.round(P.y-16+Math.sin(T*0.1)-pop);
  ctx.globalAlpha=a;ctx.fillStyle='#0a0d24';ctx.fillRect(x-8,y-7,17,15);ctx.fillRect(x-P.face*3-1,y+8,4,3);
  ctx.fillStyle='#ffffff';ctx.fillRect(x-7,y-6,15,13);ctx.fillRect(x-P.face*3,y+7,2,3);
  ctx.drawImage(icon(EMO[emo.cur].i),x-3,y-3);ctx.globalAlpha=1;}
function drawPrompts(cx){if(dialog||P.dead)return;const nn=nearNPCs(60).filter(n=>n.state==='idle'||n.state==='wave'||n.state==='dance');
  for(const n of nn){const x=Math.round(n.x-cx),y=Math.round(n.y-npcH(n)-14+Math.sin(T*0.12)*2);ctx.fillStyle='#0a0d24';ctx.fillRect(x-6,y-1,12,11);ctx.fillStyle='#ffffff';ctx.fillRect(x-5,y,10,9);txt('E',x+1,y+1,'#0a0d24','center',8,false);}}

function drawHUD(){
  // carburant
  ctx.fillStyle='rgba(10,13,36,0.6)';ctx.fillRect(4,4,104,22);
  ctx.drawImage(spr('can','can'),8,7);
  ctx.fillStyle='#0a0d24';ctx.fillRect(18,8,52,8);
  const f=P.fuel/100,segs=10;for(let k=0;k<segs;k++){if(k/segs<f){const lowBlink=P.fuel<25&&T%30<15;ctx.fillStyle=P.fuel>50?'#5fe07a':P.fuel>25?'#ffd23f':(lowBlink?'#ffffff':'#ff4a4a');ctx.fillRect(19+k*5,9,4,6);}}
  txt('x'+P.cans,74,9,'#ffffff','left');
  txt(Math.floor(P.x/8)+' M',8,18,'#9fb4ff','left',8,false);
  if(P.lights){ctx.fillStyle='#ffe27a';ctx.fillRect(98,18,4,4);}
  // émotion
  const E=EMO[emo.cur],tw=Math.max(60,E.n.length*8+20);
  ctx.fillStyle='rgba(10,13,36,0.6)';ctx.fillRect(W-4-tw,4,tw,14);
  ctx.fillStyle='#ffffff';ctx.fillRect(W-tw+1,6,10,10);ctx.drawImage(icon(E.i),W-tw+2,7);
  txt(E.n,W-8,7,'#ffffff','right');
  if(muted)txt('SON COUPÉ',W-8,H-12,'#9fb4ff','right',8);
  // bandeau de biome
  if(banner){const t=banner.t,a=Math.min(1,t/30,(220-t)/20);ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle='rgba(10,13,36,0.55)';ctx.fillRect(0,40,W,34);
    txt('~ '+banner.b.name+' ~',W/2,46,'#ff4fa3','center',16);txt(banner.b.sub,W/2,64,'#e8ecff','center');ctx.globalAlpha=1;}
  // dialogue
  if(dialog){const K=NPCK[dialog.n.k],line=K.lines[dialog.i].slice(0,Math.floor(dialog.shown));
    const bx=8,by=H-62,bw=W-16,bh=54;ctx.fillStyle='#0a0d24';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#ff4fa3';ctx.fillRect(bx,by,bw,2);ctx.fillRect(bx,by+bh-2,bw,2);ctx.fillRect(bx,by,2,bh);ctx.fillRect(bx+bw-2,by,2,bh);
    txt(K.name,bx+8,by+7,'#ff4fa3','left');
    ctx.font='8px '+FONT;const words=line.split(' ');let l='',ly=by+20;
    for(const w of words){const test=l?l+' '+w:w;if(ctx.measureText(test).width>bw-18){txt(l,bx+8,ly,'#ffffff','left');l=w;ly+=11;}else l=test;}txt(l,bx+8,ly,'#ffffff','left');
    if(dialog.shown>=K.lines[dialog.i].length&&T%40<26)txt('E',bx+bw-14,by+bh-13,'#ffd23f','left');}
  else if(hint){const a=Math.min(1,hint.t/20);ctx.globalAlpha=a;ctx.fillStyle='rgba(10,13,36,0.7)';ctx.fillRect(0,H-20,W,14);txt(hint.text,W/2,H-17,'#ffd23f','center');ctx.globalAlpha=1;}
}

const CONTROLS=[['FLÈCHES / Q D','ROULER'],['ESPACE / Z','SAUTER'],['MAJ','TURBO + FUMÉE'],['L','PHARES'],['H','KLAXON'],['E','PARLER AUX PNJ'],['P','PAUSE    M : SON']];
function drawControls(y){CONTROLS.forEach((c,k)=>{txt(c[0],W/2-8,y+k*11,'#ffd23f','right');txt(c[1],W/2+8,y+k*11,'#e8ecff','left');});}

function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  if(mode==='title'){renderTitle();return;}
  const sh=shake?(Math.random()-0.5)*shake:0;const cx=Math.round(camX+sh);
  const bl=blendAt(camX+W/2);
  drawBG(bl.a,cx);if(bl.t>0.001){ctx.globalAlpha=bl.t;drawBG(bl.b,cx);ctx.globalAlpha=1;}
  const fog=ctx.createLinearGradient(0,H-46,0,H);fog.addColorStop(0,'rgba(4,6,20,0)');fog.addColorStop(1,'rgba(4,6,20,0.75)');ctx.fillStyle=fog;ctx.fillRect(0,H-46,W,46);
  ctx.save();if(shake)ctx.translate(0,Math.round((Math.random()-0.5)*shake*0.6));
  const vis=chunksAround(camX,1,Math.ceil(W/CH)+1);
  for(const c of vis){const B=BIOMES[c.bi];for(const p of c.posts)drawPost(p,cx);if(c.sign)drawSign(c.sign,B,cx);}
  for(const c of vis){const B=BIOMES[c.bi];for(const s of c.solids)drawSolid(s,B,cx);for(const s of c.spikes)drawSpikes(s,B,cx);}
  for(const c of vis){for(const d of c.decor)drawDecor(d,cx);for(const n of c.npcs)if(n.state!=='gone')drawNPC(n,cx);
    for(const k of c.cans){if(k.taken)continue;const y=k.y+Math.sin(T*0.08+k.ph)*2;ctx.drawImage(spr('can','can'),Math.round(k.x-cx),Math.round(y));if((T+k.ph*40|0)%70<6){ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(k.x-cx)+5,Math.round(y)+1,1,1);ctx.fillRect(Math.round(k.x-cx)+4,Math.round(y)+2,3,1);}}}
  drawParticles(cx);
  if(!P.dead||P.y<H)drawCar(cx);
  drawWeather();
  drawLighting(cx,vis);
  drawRings(cx);drawFloats(cx);drawBubble(cx);drawPrompts(cx);
  ctx.restore();
  drawHUD();
  if(mode==='pause'){ctx.fillStyle='rgba(6,8,26,0.82)';ctx.fillRect(0,0,W,H);txt('PAUSE',W/2,30,'#ff4fa3','center',16);drawControls(64);txt('P OU ÉCHAP POUR REPRENDRE',W/2,H-24,'#9fb4ff','center');}
}
function renderTitle(){const B=BIOMES[5],cx=Math.round(T*0.8);
  drawBG(B,cx);ctx.fillStyle='rgba(4,6,20,0.25)';ctx.fillRect(0,0,W,H);
  const gy=184;for(let x=0;x<W;x+=2){const wx=x+cx;ctx.fillStyle=B.dirt;ctx.fillRect(x,gy,2,H-gy);const hh=3+((hash(wx*3+11)*3)|0);ctx.fillStyle=B.top;ctx.fillRect(x,gy,2,hh);if(hash(wx*5+7)<0.35){ctx.fillStyle=B.top2;ctx.fillRect(x,gy,2,1);}if(hash(wx*7+gy*131)<0.08){ctx.fillStyle=B.dirt2;ctx.fillRect(x,gy+8+((hash(wx)*20)|0),2,2);}}
  if(wType!=='starrain')setWeather('starrain');moveWeather(0.8);drawWeather();
  if(carReady){const y=gy-CHT+((T%10<5)?0:-1);ctx.drawImage(carImg,W/2-CW/2+40,y,CW,CHT);if(T%5===0)puff(W/2-CW/2+42+cx,gy-5,-1,-0.3,2,0.12,40,'#b9bfd4');}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.s+=p.g;p.life--;}parts=parts.filter(p=>p.life>0);drawParticles(cx);
  txt('BYE BYE',W/2,16,'#ffffff','center',8);
  txt('HYPER DUPER',W/2+2,34,'#3a0a2a','center',24,false);txt('HYPER DUPER',W/2,32,'#ff4fa3','center',24,'#16205a');
  if(T%60<40)txt(isTouch?'TOUCHE L\'ÉCRAN POUR JOUER':'ENTRÉE POUR JOUER',W/2,64,'#ffd23f','center');
  ctx.fillStyle='rgba(6,8,26,0.6)';ctx.fillRect(W/2-150,78,300,80);drawControls(83);
  txt('prototype',W/2,H-12,'#9fb4ff','center',8,false);}

/* ================= boucle ================= */
function step(){
  T++;
  if(mode==='title'){if(pressed.start||pressed.jump)startGame();}
  else{
    if(pressed.pause)mode=mode==='pause'?'play':'pause';
    if(pressed.mute)muted=!muted;
    if(mode==='play'){chunksAround(camX,1,4);updatePlayer();updateNPCs();updateEmotion();updateParticles();updateCamera();updateWeather();}
  }
  for(const k in pressed)pressed[k]=false;
}
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){step();acc-=1000/60;n++;}render();requestAnimationFrame(frame);}

function boot(data){
  if(data&&data.mode==='play'&&typeof data.x==='number'){startGame();P.x=data.x;P.y=groundTopAt(data.x+P.w/2)-P.h;P.fuel=data.fuel;P.cans=data.cans;cp=data.cp||cp;camX=Math.max(0,P.x-W/3);curBiome=biomeIdx(P.x+P.w/2);banner=null;hintQ.length=0;}
  requestAnimationFrame(t=>{last=t;frame(t);});
}
try{window.claude?.hot?.snapshot?.(()=>({mode:mode==='pause'?'play':mode,x:P.x,fuel:P.fuel,cans:P.cans,cp}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
cv.focus();
})();
</script>
